type: object
description: Where this page sits in the whole result.
required: [number, size, totalItems, totalPages]
properties:
  number:
    type: integer
    format: int32
    minimum: 0
    maximum: 10000
    description: 0-based page number.
    examples: [0]
  size:
    type: integer
    format: int32
    minimum: 1
    maximum: 100
    description: Requested page size.
    examples: [25]
  totalItems:
    type: integer
    format: int64
    minimum: 0
    # Largest integer JavaScript represents exactly.
    maximum: 9007199254740991
    examples: [1342]
  totalPages:
    type: integer
    format: int32
    minimum: 0
    maximum: 2147483647
    examples: [54]
