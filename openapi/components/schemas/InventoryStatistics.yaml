type: object
required:
  - generatedAt
  - cycleName
  - vaults
properties:
  generatedAt:
    type: string
    format: date-time
    maxLength: 35
    examples:
      - 2026-11-14T12:00:00Z
  cycleName:
    type: string
    maxLength: 100
    description: Organization-configured inventory cycle name.
    examples:
      - Example
  vaults:
    type: array
    maxItems: 100
    items:
      $ref: VaultStatistic.yaml
