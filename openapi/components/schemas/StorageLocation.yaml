type: object
description: An exact configured terminal storage position (niche), never merely
  an arbitrary childless vault. path lists ancestor and current position names
  in root-to-leaf order.
required:
  - id
  - code
  - name
  - path
properties:
  id:
    type: string
    maxLength: 36
    format: uuid
  code:
    type: string
    maxLength: 100
  name:
    type: string
    maxLength: 200
  path:
    type: array
    minItems: 1
    maxItems: 20
    items:
      type: string
      maxLength: 200
