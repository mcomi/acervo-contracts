type: object
required:
  - totalContainers
  - isDemo
properties:
  totalContainers:
    type: integer
    format: int64
    minimum: 0
    maximum: 9007199254740991
    description: Active physical containers, same cohort as summary containersCount.
      Requires locations.statistics.read.
    examples:
      - 120
  custodyConfirmedCount:
    type: integer
    format: int64
    minimum: 0
    maximum: 9007199254740991
    description: Containers with current location, responsible area and custody
      confirmation; requires custody.statistics.read and
      locations.statistics.read.
    examples:
      - 120
  documentedCount:
    type: integer
    format: int64
    minimum: 0
    maximum: 9007199254740991
    description: Containers meeting the minimum intake documentation profile;
      requires accessions.statistics.read and locations.statistics.read. This is
      not full work cataloguing.
    examples:
      - 120
  backlogEntered:
    type: integer
    format: int64
    minimum: 0
    maximum: 9007199254740991
    description: Records newly entering this documentation backlog during the stated period.
    examples:
      - 120
  backlogCompleted:
    type: integer
    format: int64
    minimum: 0
    maximum: 9007199254740991
    description: Records leaving the same backlog during the stated period.
    examples:
      - 120
  periodStart:
    type: string
    format: date
    maxLength: 10
    examples:
      - 2026-10-01
  periodEnd:
    type: string
    format: date
    maxLength: 10
    examples:
      - 2026-10-31
  priorities:
    type: array
    maxItems: 3
    items:
      $ref: DashboardPriority.yaml
    description: 'Only kinds the user may read: custody for acknowledgement;
      conservation for condition-review; locations for location-confirmation.
      Each requires the corresponding statistics.read permission and
      entitlement.'
  collections:
    type: array
    maxItems: 100
    items:
      $ref: DashboardCollection.yaml
  isDemo:
    type: boolean
    description: Synthetic demo data must never be represented as operational evidence.
