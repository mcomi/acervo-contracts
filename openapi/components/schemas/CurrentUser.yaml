type: object
required: [id, displayName, email, locale]
properties:
  id:
    type: string
    format: uuid
    maxLength: 36
    readOnly: true
    examples: [0192f0c4-1a2b-7c3d-8e4f-5a6b7c8d9e0f]
  displayName:
    type: string
    maxLength: 200
    examples: [Ana López]
  email:
    type: string
    format: email
    maxLength: 320
    examples: [ana.lopez@example.org]
  locale:
    type: string
    maxLength: 35
    pattern: ^[a-z]{2,3}(-[A-Z]{2})?$
    description: Preferred language and region (BCP 47), for the interface and formats.
    examples: [es-MX]
