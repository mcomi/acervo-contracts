openapi: 3.1.1
info:
  title: Acervo API
  version: 0.0.0
  summary: Management of audiovisual archives as a service.
  description: |
    Contract between the Acervo web app and API. Conventions (errors, pagination, concurrency,
    tenancy, naming) are in `docs/api-guidelines.md` in the contracts repo.

    Every request acts on the organization of the signed-in user, taken from the access token.
    No path, parameter or body names an organization.
  contact:
    name: Acervo team
    url: https://github.com/mcomi/acervo-contracts
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.acervo.example/v1
    description: Production (placeholder until hosting is decided)
    x-internal: false
security:
  - bearerAuth: []
tags:
  - name: platform
    description: Session, organizations, users and subscriptions.
  - name: catalog
    description: Works and their variants, manifestations and items (FIAF model).
  - name: inventory
    description: Inventory cycles and statistics.
  - name: lab
    description: Digitization and restoration statistics.
  - name: locations
    description: Physical containers, configured types and storage positions.
  - name: custody
    description: Baseline custody observations and subsequent custody history.
paths:
  /me:
    $ref: paths/platform/me.yaml
  /catalog/works:
    $ref: paths/catalog/works.yaml
  /catalog/works/{workId}:
    $ref: paths/catalog/work.yaml
  /platform/dashboard:
    $ref: paths/platform/dashboard.yaml
  /inventory/statistics:
    $ref: paths/inventory/statistics.yaml
  /lab/statistics:
    $ref: paths/lab/statistics.yaml
  /platform/areas:
    $ref: paths/platform/areas.yaml
  /locations/locations:
    $ref: paths/locations/locations.yaml
  /locations/container-types:
    $ref: paths/locations/container-types.yaml
  /locations/containers:
    $ref: paths/locations/containers.yaml
  /locations/containers/lookup:
    $ref: paths/locations/container-lookup.yaml
  /locations/containers/{containerId}:
    $ref: paths/locations/container.yaml
  /custody/existing-holdings:
    $ref: paths/custody/existing-holdings.yaml
  /custody/containers/{containerId}/history:
    $ref: paths/custody/container-history.yaml
  /locations/location-definitions:
    $ref: paths/locations/location-definitions.yaml
  /locations/location-definitions/{locationId}:
    $ref: paths/locations/location-definitions-detail.yaml
  /locations/container-type-definitions:
    $ref: paths/locations/container-type-definitions.yaml
  /locations/container-type-definitions/{containerTypeId}:
    $ref: paths/locations/container-type-definitions-detail.yaml
  /platform/area-definitions:
    $ref: paths/platform/area-definitions.yaml
  /platform/area-definitions/{areaId}:
    $ref: paths/platform/area-definitions-detail.yaml
  /locations/code-format:
    $ref: paths/locations/code-format.yaml
  /locations/code-format-preview:
    $ref: paths/locations/code-format-preview.yaml
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token issued by the identity provider (Keycloak, OpenID Connect). Tokens are
        short-lived JWTs validated following RFC8725. The token carries the user and the
        organization; the API derives entitlements and permissions from them.
