parameters:
  - $ref: ../../components/parameters/ContainerId.yaml
get:
  operationId: getContainerIdentification
  tags:
    - custody
  summary: Get container identification state
  description:
    Returns the identification aggregate ETag, independent of container representation and
    baseline history. This is the ETag required for identification commands.
  x-permission: custody.identifications.read
  x-required-entitlements:
    - custody
    - locations
    - catalog
  x-additional-permissions:
    - locations.containers.read
    - catalog.copies.read
  responses:
    '200':
      description: Current identification state and ETag
      headers:
        ETag:
          $ref: ../../components/headers/ETag.yaml
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/IdentificationState.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '429':
      $ref: ../../components/responses/TooManyRequests.yaml
    '500':
      $ref: ../../components/responses/InternalServerError.yaml
