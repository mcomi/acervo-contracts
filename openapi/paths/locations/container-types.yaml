get:
  operationId: listContainerTypes
  tags:
    - locations
  summary: List active container types
  description: Configured physical types in the current organization, sorted by
    code then id. Requires locations entitlement.
  x-permission: locations.containers.read
  parameters:
    - $ref: ../../components/parameters/Page.yaml
    - $ref: ../../components/parameters/PageSize.yaml
  responses:
    '200':
      description: List active container types
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/ContainerTypePage.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '429':
      $ref: ../../components/responses/TooManyRequests.yaml
    '500':
      $ref: ../../components/responses/InternalServerError.yaml
