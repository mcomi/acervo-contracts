get:
  operationId: listContainers
  tags:
    - locations
  summary: List containers
  description: Current organization only. Search is literal case-insensitive label
    transcription or server-normalized code substring; normalize code query with
    the same comparison rule as registration. Requires locations entitlement.
  x-permission: locations.containers.read
  parameters:
    - name: search
      in: query
      description: Literal case-insensitive substring, never a wildcard or regular
        expression.
      schema:
        type: string
        maxLength: 200
        minLength: 1
    - $ref: ../../components/parameters/Page.yaml
    - $ref: ../../components/parameters/PageSize.yaml
    - name: sort
      in: query
      schema:
        $ref: ../../components/schemas/ContainersSortField.yaml
  responses:
    '200':
      description: List containers
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/ContainerPage.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '429':
      $ref: ../../components/responses/TooManyRequests.yaml
    '500':
      $ref: ../../components/responses/InternalServerError.yaml
