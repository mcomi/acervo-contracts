name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

# Versions are bumped by CI, never by hand. With pending changesets this opens (or updates) a
# "Version Packages" pull request; merging it tags the release and publishes a GitHub release with
# the bundled contract attached, which is the file consumers copy.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # Private package: `changeset publish` only creates the git tag, nothing goes to npm.
          publish-script: pnpm changeset publish
          commit-message: 'Release: version packages'
          pr-title: 'Release: version packages'
      - if: steps.changesets.outputs.published == 'true'
        name: Attach the bundled contract to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm build
          version=$(node -p "require('./package.json').version")
          gh release upload "v${version}" dist/openapi.yaml --clobber
